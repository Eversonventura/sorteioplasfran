<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorteio Plasfran</title>
<style>
  :root {
    --bg: #0f1226;
    --card: #181c3a;
    --text: #f4f5ff;
    --muted: #9aa0d0;
    --accent: #ffb300;
    --accent2: #ff5e7e;
    --ok: #35d49a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: radial-gradient(circle at 20% 10%, #2a2f6b 0%, transparent 45%),
                radial-gradient(circle at 80% 90%, #5a1f4a 0%, transparent 45%), var(--bg);
    padding: 16px;
  }
  .card {
    width: 100%; max-width: 560px; background: var(--card); border-radius: 24px;
    padding: 32px 24px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.45);
    border: 1px solid rgba(255,255,255,.08);
  }
  h1 { margin: 0 0 4px; font-size: 1.6rem; letter-spacing: .5px; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: .95rem; }
  .display {
    margin: 0 auto 24px; width: 260px; height: 260px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 6.5rem; font-weight: 800; font-variant-numeric: tabular-nums;
    background: radial-gradient(circle at 30% 25%, #2f356e, #12152f);
    border: 6px solid var(--accent);
    box-shadow: 0 0 40px rgba(255,179,0,.25), inset 0 0 30px rgba(0,0,0,.5);
    transition: box-shadow .3s, border-color .3s;
  }
  .display.spinning { animation: pulse .5s infinite alternate; }
  .display.winner { border-color: var(--ok); box-shadow: 0 0 70px rgba(53,212,154,.55), inset 0 0 30px rgba(0,0,0,.5); animation: pop .6s; }
  @keyframes pulse { from { box-shadow: 0 0 30px rgba(255,179,0,.2); } to { box-shadow: 0 0 70px rgba(255,94,126,.6); } }
  @keyframes pop { 0% { transform: scale(.85); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }
  .status { min-height: 1.5em; margin-bottom: 20px; color: var(--muted); font-weight: 600; }
  .status.ok { color: var(--ok); }
  .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  button {
    font: inherit; font-weight: 700; border: 0; border-radius: 14px; padding: 14px 26px;
    cursor: pointer; transition: transform .1s, opacity .2s;
  }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #1b1020; font-size: 1.1rem; }
  .ghost { background: transparent; color: var(--text); border: 1px solid rgba(255,255,255,.25); }
  .history { margin-top: 24px; color: var(--muted); font-size: .9rem; }
  .chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
  .chip { background: rgba(255,255,255,.08); color: var(--text); padding: 4px 12px; border-radius: 999px; font-weight: 700; }
  .range { display: flex; gap: 8px; justify-content: center; align-items: center; margin-bottom: 20px; color: var(--muted); font-size: .9rem; }
  .range input { width: 80px; padding: 8px; border-radius: 10px; border: 1px solid rgba(255,255,255,.2); background: rgba(0,0,0,.25); color: var(--text); font: inherit; text-align: center; }
  canvas { position: fixed; inset: 0; pointer-events: none; }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<main class="card">
  <h1>🎉 Sorteio Plasfran</h1>
  <p class="sub">Sorteio de um número aleatório</p>

  <div class="range">
    De <input id="min" type="number" value="1" min="1"> até <input id="max" type="number" value="150" min="1">
  </div>

  <div class="display" id="display">?</div>
  <div class="status" id="status">Pronto para sortear</div>

  <div class="actions">
    <button class="primary" id="draw">Sortear</button>
    <button class="ghost" id="reset">Limpar histórico</button>
  </div>

  <div class="history" id="history" hidden>
    Números já sorteados (não se repetem):
    <div class="chips" id="chips"></div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const display = $('display'), status = $('status'), drawBtn = $('draw');
const drawn = [];
let busy = false;

function randInt(min, max) {
  const range = max - min + 1;
  const limit = Math.floor(0x100000000 / range) * range;
  const buf = new Uint32Array(1);
  do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
  return min + (buf[0] % range);
}

function setStatus(text, ok) {
  status.textContent = text;
  status.classList.toggle('ok', !!ok);
}

function renderHistory() {
  $('history').hidden = drawn.length === 0;
  $('chips').innerHTML = drawn.map(n => `<span class="chip">${n}</span>`).join('');
}

function draw() {
  if (busy) return;
  const min = parseInt($('min').value, 10), max = parseInt($('max').value, 10);
  if (!Number.isInteger(min) || !Number.isInteger(max) || min > max) {
    setStatus('Intervalo inválido', false); return;
  }
  const pool = [];
  for (let i = min; i <= max; i++) if (!drawn.includes(i)) pool.push(i);
  if (!pool.length) { setStatus('Todos os números já foram sorteados', false); return; }

  const result = pool[randInt(0, pool.length - 1)];
  busy = true; drawBtn.disabled = true;
  display.classList.remove('winner'); display.classList.add('spinning');
  setStatus('Sorteando...');

  const total = 3500, start = performance.now();
  (function tick(now) {
    const t = Math.min((now - start) / total, 1);
    if (t < 1) {
      display.textContent = randInt(min, max);
      // desacelera ao longo do tempo
      setTimeout(() => requestAnimationFrame(tick), 40 + t * t * 320);
    } else {
      display.textContent = result;
      display.classList.remove('spinning'); display.classList.add('winner');
      drawn.push(result); renderHistory();
      setStatus(`Número sorteado: ${result}`, true);
      drawBtn.textContent = 'Sortear novamente';
      drawBtn.disabled = false; busy = false;
      confetti();
    }
  })(start);
}

// confete simples
const cv = $('fx'), ctx = cv.getContext('2d');
function confetti() {
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = ['#ffb300', '#ff5e7e', '#35d49a', '#6ea8ff', '#fff'];
  const ps = Array.from({ length: 160 }, () => ({
    x: cv.width / 2, y: cv.height / 2 - 60,
    vx: (Math.random() - .5) * 18, vy: Math.random() * -16 - 3,
    s: Math.random() * 8 + 4, c: colors[Math.floor(Math.random() * colors.length)],
    r: Math.random() * 6
  }));
  let frames = 0;
  (function step() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(p => {
      p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += .2;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); ctx.restore();
    });
    if (++frames < 200) requestAnimationFrame(step); else ctx.clearRect(0, 0, cv.width, cv.height);
  })();
}

drawBtn.addEventListener('click', draw);
$('reset').addEventListener('click', () => {
  if (busy) return;
  drawn.length = 0; renderHistory();
  display.textContent = '?'; display.classList.remove('winner');
  drawBtn.textContent = 'Sortear'; setStatus('Pronto para sortear');
});
</script>
</body>
</html>
